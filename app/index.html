<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alison Melo | DevOps Journey</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --bg: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 3rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.8rem;
            border: 1px solid rgba(34, 197, 94, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .architecture-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 900px;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .step-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            padding: 1.5rem;
            border-radius: 16px;
            text-align: center;
            flex: 1;
            min-width: 150px;
            transition: transform 0.3s ease;
        }

        .step-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
        }

        .step-card i {
            font-size: 2rem;
            display: block;
            margin-bottom: 1rem;
        }

        .arrow {
            color: var(--border);
            font-size: 1.5rem;
        }

        .footer {
            margin-top: auto;
            padding: 2rem;
            color: #64748b;
            font-size: 0.9rem;
        }

        .tech-stack {
            margin-top: 3rem;
            display: flex;
            gap: 1.5rem;
        }

        .tech-item {
            font-weight: 600;
            color: #94a3b8;
        }

        /* Simulação do fluxo visual moderno */
        .flow-line {
            height: 2px;
            background: linear-gradient(to right, transparent, var(--primary), transparent);
            width: 100%;
            max-width: 800px;
            margin: 2rem 0;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header>
        <span class="status-badge">● Deploy Automático Ativo!</span>
        <h1>Alison Melo</h1>
        <p style="color: #94a3b8; font-size: 1.2rem;">DevOps Portfolio Project</p>
    </header>

    <div class="flow-line"></div>

    <div class="architecture-container">
        <div class="step-card">
            <i class="fa-brands fa-github" style="color: #fff;"></i>
            <strong>Code</strong>
            <p style="font-size: 0.7rem; color: #64748b;">GitHub Actions Push</p>
        </div>

        <div class="arrow"><i class="fa-solid fa-chevron-right"></i></div>

        <div class="step-card">
            <i class="fa-solid fa-cloud" style="color: #f97316;"></i>
            <strong>Infra</strong>
            <p style="font-size: 0.7rem; color: #64748b;">Terraform (OCI)</p>
        </div>

        <div class="arrow"><i class="fa-solid fa-chevron-right"></i></div>

        <div class="step-card">
            <i class="fa-solid fa-gears" style="color: #ef4444;"></i>
            <strong>Config</strong>
            <p style="font-size: 0.7rem; color: #64748b;">Ansible Playbook</p>
        </div>

        <div class="arrow"><i class="fa-solid fa-chevron-right"></i></div>

        <div class="step-card">
            <i class="fa-brands fa-docker" style="color: #00d2ff;"></i>
            <strong>Deploy</strong>
            <p style="font-size: 0.7rem; color: #64748b;">Docker Nginx</p>
        </div>
    </div>

    <div class="tech-stack">
        <span class="tech-item">#Terraform</span>
        <span class="tech-item">#Ansible</span>
        <span class="tech-item">#OracleCloud</span>
        <span class="tech-item">#CI/CD</span>
    </div>

    <div class="footer">
        © 2026 - Provisionado via Infra-as-Code
    </div>

</body>
</html>
